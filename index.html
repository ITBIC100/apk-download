<!DOCTYPE html>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dfe9f3,#ffffff);
    padding:20px;
}

.phone{
    width:100%;
    max-width:360px;
    background:radial-gradient(circle,rgba(255,255,255,.5) 1px, transparent 1px);
    background-size:4px 4px;
    border-radius:40px;
    padding:25px 18px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:
        0 15px 40px rgba(0,0,0,.12),
        inset 0 1px 1px rgba(255,255,255,.8);
}

/* ===== JAM & TANGGAL (live) ===== */
.time{
    margin-top:65px;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.time h1{
    font-size:44px;
    font-weight:600;
    line-height:1;
    color:#111;
    font-variant-numeric:tabular-nums;
}

.time .pink{ color:#ff5db1; }
.time .blue{ color:#31b7ff; }

.time .colon{
    color:#bbb;
    animation:blink 1s steps(1) infinite;
}

@keyframes blink{
    50%{ opacity:0; }
}

.date{
    margin-bottom:4px;
    font-size:12px;
    color:#666;
    line-height:1.2;
}

.date strong{ color:#555; }

/* ===== GLASS ===== */
.glass{
    background:rgba(255,255,255,.25);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:
        0 6px 15px rgba(0,0,0,.08),
        inset 0 1px 1px rgba(255,255,255,.9);
}

.weather{
    margin-top:15px;
    padding:12px 15px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:#666;
}

.weather .seconds{
    font-variant-numeric:tabular-nums;
    color:#999;
}

/* ===== TOMBOL DOWNLOAD ===== */
.apps{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.app-card{
    min-height:64px;
    border-radius:12px;
    display:flex;
    align-items:center;
    padding:12px 15px;
    gap:12px;
    text-decoration:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
}

.app-card:hover{
    transform:translateY(-2px);
    box-shadow:
        0 10px 22px rgba(0,0,0,.12),
        inset 0 1px 1px rgba(255,255,255,.9);
}

.app-card:active{ transform:scale(.98); }

.app-card:focus-visible{
    outline:2px solid #31b7ff;
    outline-offset:2px;
}

.app-icon{
    font-size:26px;
    flex-shrink:0;
}

.app-info{
    flex:1;
    min-width:0;
}

.app-title{
    font-size:14px;
    font-weight:500;
    color:#444;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.app-sub{
    font-size:11px;
    color:#777;
}

.dl-btn{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ff5db1,#31b7ff);
    color:#fff;
    font-size:16px;
    font-weight:600;
    box-shadow:0 4px 10px rgba(49,183,255,.35);
}

.footer-card{
    margin-top:12px;
}

@media (prefers-reduced-motion: reduce){
    .time .colon{ animation:none; }
    .app-card{ transition:none; }
}

@media(max-width:380px){
    .phone{ max-width:100%; }
    .time h1{ font-size:38px; }
}
</style>
</head>

<body>

<div class="phone">

    <!-- Jam & tanggal berjalan otomatis -->

            <span class="pink" id="hour">--</span><span class="colon">:</span><span class="blue" id="minute">--</span>

    <!-- Tombol download file dari GitHub -->

</div>

<script>
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function pad(n){ return String(n).padStart(2,'0'); }

function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;

    document.getElementById('hour').textContent   = pad(h);
    document.getElementById('minute').textContent = pad(now.getMinutes());
    document.getElementById('ampm').textContent   = ampm;
    document.getElementById('day').textContent    = DAYS[now.getDay()];
    document.getElementById('date').textContent   = MONTHS[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
    document.getElementById('fulltime').textContent =
        pad(h) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + ' ' + ampm;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
